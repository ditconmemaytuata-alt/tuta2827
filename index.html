*{box-sizing:border-box;margin:0;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{height:100%;overflow:hidden;background:var(--ink);color:var(--tx);font-family:var(--ff)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#app{position:relative;height:100dvh;max-width:480px;margin:0 auto;overflow:hidden;padding:max(env(safe-area-inset-top),8px) 12px 0;background:radial-gradient(ellipse at 50% 0,#4a0e22 0,#14060d 48%,var(--ink) 100%)}
#bg{position:absolute;inset:0;background:var(--girl) center 20%/cover;filter:blur(22px) brightness(.22) saturate(1.3);transform:scale(1.2)}
#girl{position:absolute;left:0;right:0;bottom:0;height:52%;background:var(--girl) center top/cover;-webkit-mask-image:linear-gradient(#0000,#000 38%,#000 80%,#0000);mask-image:linear-gradient(#0000,#000 38%,#000 80%,#0000);opacity:.88;animation:breathe 5s ease-in-out infinite;transform-origin:50% 100%}
@keyframes breathe{50%{transform:scale(1.025)}}
#top,#brand,#jpwrap,#beads,#stk,#msg{position:relative}
/* top */
#top{display:flex;align-items:center;gap:8px;z-index:3}
#bal{flex:1;display:flex;align-items:center;gap:6px;height:34px;padding:0 12px 0 6px;border-radius:17px;background:linear-gradient(#2a1208,#120805);border:1.5px solid #c9a063;font-weight:800;font-size:14px;color:var(--gold2);box-shadow:inset 0 0 10px #000a}
#bal i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px;color:#4a2a05;background:radial-gradient(circle at 35% 30%,#fff3b0,#e0a21f)}
#bal.hit{animation:hit .8s cubic-bezier(.3,1.6,.5,1)}
@keyframes hit{30%{transform:scale(1.1);box-shadow:0 0 18px 3px var(--g,#ffd05a)}}
.ib{width:34px;height:34px;border-radius:50%;border:1.5px solid #c9a063;background:radial-gradient(circle at 35% 30%,#4a2410,#150a05);display:grid;place-items:center;font-size:15px;box-shadow:0 2px 6px #000a}
.ib.off{opacity:.45}
#sid{font-size:11px;font-weight:600;opacity:.75;text-align:center;min-width:64px}
/* brand */
#brand{margin:8px auto 0;width:min(86%,360px);text-align:center;z-index:2;filter:drop-shadow(0 6px 10px #000c)}
#rib{position:relative;padding:8px 0 10px;clip-path:polygon(0 14%,7% 14%,7% 0,93% 0,93% 14%,100% 14%,95% 57%,100% 100%,93% 100%,93% 86%,7% 86%,7% 100%,0 100%,5% 57%);background:linear-gradient(#d33a4a,#8a1228 55%,#5a0a1a)}
#rib::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 35%,#ffffff55 50%,transparent 65%);background-size:300% 100%;animation:sheen 4.5s ease-in-out infinite}
@keyframes sheen{0%{background-position:130% 0}100%{background-position:-130% 0}}
.gd{background:linear-gradient(180deg,#fff6c9 0%,#ffd45a 38%,#d9921a 62%,#fff0a0 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
#rib b{display:block;font-size:clamp(30px,10vw,42px);line-height:1;font-weight:900;letter-spacing:1px;filter:drop-shadow(0 2px 0 #4a1a00)}
#rib small{display:block;margin-top:3px;font-size:clamp(11px,3.4vw,14px);font-weight:800;letter-spacing:5px;filter:drop-shadow(0 1px 0 #4a1a00)}
/* jackpot */
#jpwrap{display:flex;justify-content:center;margin-top:12px;z-index:2}
#jpbar{display:flex;align-items:center;gap:8px;height:34px;padding:0 16px 0 4px;border-radius:17px;background:linear-gradient(#5b1220,#1c050b);border:1.5px solid var(--gold);box-shadow:0 0 16px #ffb30077,inset 0 0 10px #000}
#jpbar em{font-style:normal;font-size:22px;filter:drop-shadow(0 0 6px #ffb300)}
#potv{font-weight:900;font-size:19px;font-variant-numeric:tabular-nums;filter:drop-shadow(0 1px 0 #3d2200)}
#jpbar span{font-size:10px;font-weight:800;letter-spacing:2px;color:var(--gold2);opacity:.85}
/* table */
#tbl{position:relative;margin-top:calc(var(--c)*.22);height:calc(var(--c) + 38px);border-radius:999px;display:grid;grid-template-columns:1fr var(--c) 1fr;align-items:center;padding:0 12px;z-index:2;
 background:radial-gradient(ellipse at 50% -20%,#e8b04e66,transparent 60%),linear-gradient(180deg,#7b3f12,#3d1c07 55%,#1d0b03);
 border:2px solid #f0c66a;box-shadow:0 12px 30px #000d,inset 0 0 0 5px #00000066,inset 0 0 0 6px #f0c66a55,inset 0 0 30px #000b,0 0 26px #f0a83a33}
#tbl::before{content:"";position:absolute;inset:8px;border-radius:999px;border:1px dashed #f0c66a44;pointer-events:none}
.side{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0;border-radius:24px;padding:4px 2px;transition:box-shadow .3s,background .3s}
.side h2{font-size:clamp(26px,8.6vw,36px);font-weight:900;line-height:1}
#sT h2{color:#ffe9a6;text-shadow:0 0 14px #ffb30099,0 2px 0 #5a3000}
#sX h2{color:#ff8da0;text-shadow:0 0 14px #ff2a4a88,0 2px 0 #4a0510}
.pool{font-weight:900;font-size:clamp(12px,3.7vw,16px);font-variant-numeric:tabular-nums;color:var(--gold2);letter-spacing:.3px;text-shadow:0 1px 0 #000}
.pool.up{animation:pup .6s ease-out}
@keyframes pup{30%{transform:scale(1.2);color:#fff}}
.cb{width:92%;max-width:132px;height:34px;border-radius:17px;font-weight:900;font-size:14px;letter-spacing:1px;color:#4a2400;background:linear-gradient(#fff0a8,#f3b93a 55%,#c07c14);box-shadow:0 4px 0 #6e4308,0 6px 10px #000a,inset 0 2px 0 #fffb;transition:transform .1s,filter .2s}

<script>
window.onerror=m=>{const e=document.getElementById('msg');if(e)e.textContent='Lỗi: '+m};
const tg=(window.Telegram&&Telegram.WebApp)||{};try{tg.ready();tg.expand()}catch(e){}
const $=s=>document.querySelector(s),f=n=>String(Math.round(+n||0)).replace(/\B(?=(\d{3})+(?!\d))/g,'.');
const LOCK=10; /* còn <= 10s thì ngừng nhận cược */
const PIPS={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
const CH=[[1e3,'#3b82c4'],[1e4,'#2e9d5b'],[5e4,'#d9822b'],[1e5,'#c2183a'],[5e5,'#7a3fc0'],[5e6,'#1c9aa8'],[1e7,'#b8860b'],[5e7,'#444']];
const lab=v=>v>=1e6?v/1e6+'M':v/1e3+'K';
const die=v=>`<div class="die">${[...Array(9)].map((_,i)=>`<i class="${v&&PIPS[v].includes(i)?'on':''}"></i>`).join('')}</div>`;
const nm=d=>d[0]==d[1]&&d[1]==d[2]?'Bão':d[0]+d[1]+d[2]>=11?'Tài':'Xỉu';
const api=async(p,b)=>(await fetch(p,{method:b?'POST':'GET',headers:{'X-Init':tg.initData||'','Content-Type':'application/json'},body:b&&JSON.stringify(b)})).json();
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S=null,pend={s:null,a:0},deadline=0,key='',lastId=0,errUntil=0,resShown=0,popT=0,fxT=0,shaking=false,dropping=false,prevPh='',lastTick=0,opened=false,hold={win:null,until:0},diceKey='',lastKick=0,dr=false,ox=0,oy=0,sheetOn=false;
let stk={w:0,l:0};try{stk=JSON.parse(localStorage.getItem('stk'))||stk}catch(e){}
const secLeft=()=>Math.max(0,Math.ceil((deadline-Date.now())/1000));
const closed=()=>!!S&&S.phase==='bet'&&secLeft()<=LOCK;
const err=m=>{errUntil=Date.now()+2200;$('#msg').textContent=m};
const hap=t=>{try{tg.HapticFeedback&&tg.HapticFeedback.impactOccurred(t)}catch(e){}};

/* ===== chip + sheet ===== */
CH.forEach(([v,c])=>{const b=document.createElement('button');b.className='chip';b.style.setProperty('--cc',c);b.textContent=lab(v);
 b.onclick=()=>{if(!S||closed())return;if(!pend.s)return;pend.a=Math.min(pend.a+v,S.bal);b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop');window.SFX&&SFX.click();hap('light');sheetUI()};$('#chips').appendChild(b)});
function sheetUI(){if(!pend.s||!S)return;const t=$('#shT'),mine=S.my[pend.s]||0;
 t.textContent='CƯỢC '+(pend.s==='tai'?'TÀI':'XỈU');t.className=pend.s;
 $('#shB').textContent='Số dư: '+f(S.bal)+(mine?' · Đã cược: '+f(mine):'');
 $('#amt').innerHTML=f(pend.a)+(pend.a?'':'<small>Chọn mức tiền bên dưới</small>')}
function openSheet(side){
 if(!S||S.phase!=='bet')return;if(S.mt)return err('Game đang bảo trì');
 if(closed())return err('Đã đóng cược, chờ phiên sau');
 if(S.my[side==='tai'?'xiu':'tai'])return err('Mỗi phiên chỉ cược một cửa');
 if(pend.s!==side)pend={s:side,a:0};sheetUI();sheetOn=true;$('#bs').classList.add('on');$('#mask').classList.add('on');window.SFX&&SFX.click()}
function closeSheets(keep){sheetOn=false;$('#bs').classList.remove('on');$('#cs').classList.remove('on');$('#mask').classList.remove('on');if(!keep)pend={s:null,a:0}}
$('#bt').onclick=()=>openSheet('tai');$('#bx').onclick=()=>openSheet('xiu');
$('#mask').onclick=()=>closeSheets();$('#no').onclick=()=>closeSheets();
$('#cbtn').onclick=()=>{drawCau(S?S.hist:[]);$('#cs').classList.add('on');$('#mask').classList.add('on')};$('#cx2').onclick=()=>closeSheets();
$('#allin').onclick=()=>{if(!S||!pend.s||closed())return;pend.a=S.bal;sheetUI()};
$('#ok').onclick=async()=>{
 if(!S||closed()||S.phase!=='bet'){closeSheets();return err('Đã hết giờ nhận cược')}
 if(!pend.s||!pend.a)return err('Chọn mức tiền để cược');
 const side=pend.s,a=pend.a,r=await api('/api/bet',{side,amt:a});
 if(r.err){err(r.err)}else{closeSheets();flyBal('-'+f(a),false);hap('medium');window.SFX&&SFX.click()}
 tick()};

/* ===== cầu ===== */
function drawCau(h){
 const a=[...h].reverse();let T=0,X=0,B=0;a.forEach(d=>{const k=nm(d);k==='Tài'?T++:k==='Xỉu'?X++:B++});
 const L=a.slice(-16);$('#beads').innerHTML=L.map((d,i)=>`<span class="bd ${{Tài:'T',Xỉu:'X',Bão:'B'}[nm(d)]}${i===L.length-1?' last':''}"></span>`).join('');
 const R=6,C=24,t=a.slice(-R*C);let s=`<svg width="100%" viewBox="0 0 ${C*12} ${R*12}">`;
 t.forEach((d,i)=>{const k=nm(d),c=Math.floor(i/R),r=i%R;s+=`<circle class="${k==='Tài'?'cT':k==='Xỉu'?'cX':'cB'}" cx="${c*12+6}" cy="${r*12+6}" r="4.8"/>`});
 $('#bead').innerHTML=s+'</svg>';
 $('#stats').innerHTML=`<span style="color:#ffe9a6">Tài ${T}</span><span style="color:#ff8da0">Xỉu ${X}</span><span style="color:#6fd3ff">Bão ${B}</span>`;
 const l=a.slice(-20),n=l.length,W=300,H=70,xs=i=>n>1?i*W/(n-1):W/2,ys=v=>H-(v-3)/15*H;
 let g=`<svg width="100%" viewBox="0 0 ${W} ${H}" style="overflow:visible"><line x1="0" x2="${W}" y1="${ys(10.5)}" y2="${ys(10.5)}" stroke="#8a6a40" stroke-dasharray="3 3"/>`;
 if(n)g+=`<polyline fill="none" stroke="#f0c66a" stroke-width="1.6" points="${l.map((d,i)=>xs(i)+','+ys(d[0]+d[1]+d[2])).join(' ')}"/>`;
 l.forEach((d,i)=>{const k=nm(d);g+=`<circle cx="${xs(i)}" cy="${ys(d[0]+d[1]+d[2])}" r="3" class="${k==='Tài'?'cT':k==='Xỉu'?'cX':'cB'}"/>`});
 $('#gr').innerHTML=g+'</svg>'}

/* ===== kết quả ===== */
const blinkEl=e=>{e.classList.remove('blink');void e.offsetWidth;e.classList.add('blink')};
function fx(R,live){
 if(!R||resShown===R.id)return;resShown=R.id;
 if(R.jp&&R.jp.total>0)setTimeout(()=>showJP(R.jp),live?1500:400);
 const stake=Object.values(R.my||{}).reduce((a,b)=>a+b,0),net=R.net||0,d=R.dice,tg_=$('#tag');
 tg_.textContent=(d[0]+d[1]+d[2])+' · '+(R.jp?'NỔ HŨ':nm(d).toUpperCase());tg_.dataset.w=R.win||'bao';blinkEl(tg_);
 hold={win:R.win||null,until:Date.now()+(live?4600:6500)};
 if(live){const dc=$('#dice');dc.classList.remove('rv');void dc.offsetWidth;dc.classList.add('rv');window.SFX&&SFX.thump()}
 burst(live?70:50,stake&&net<=0?'lose':'win');
 clearTimeout(fxT);fxT=setTimeout(()=>$('#dice').classList.remove('rv'),4600);
 if(!stake)return;
 if(net>0){stk={w:stk.w+1,l:0};window.SFX&&SFX.win();rain(46)}else{stk={w:0,l:stk.l+1};window.SFX&&SFX.lose()}
 try{localStorage.setItem('stk',JSON.stringify(stk))}catch(e){}
 const p=$('#pop');p.className='on '+(net>0?'w':'l');
 p.innerHTML=`<b>${net>0?'+':''}${f(net)}</b><small>${net>0?'Nhận về '+f(net+stake):'Chúc may mắn phiên sau'}</small>`;
 flyBal((net>0?'+':'')+f(net),net>0);
 clearTimeout(popT);popT=setTimeout(()=>{p.className='';p.innerHTML=''},2200)}

/* ===== render ===== */
function render(){
 const bw=$('#bowl'),k=S.id+S.phase,app=$('#app');
 if(S.id!==lastId){lastId=S.id;pend={s:null,a:0};$('#dice').classList.remove('rv');if(sheetOn)closeSheets()}
 if(k!==key){if(S.phase==='cover'&&prevPh==='bet'){shake();closeSheets()}prevPh=S.phase;key=k;ox=oy=0;opened=false;dr=false;bw.style.transform=''}
 deadline=(S._t||Date.now())+S.left*1000;app.dataset.ph=S.phase;
 $('#num').textContent='# '+S.id;$('#sid').textContent='#'+S.id;$('#balv').textContent=f(S.bal);
 {const pv=f(S.pot||0),pe=$('#potv');if(pe.textContent!==pv){pe.textContent=pv;pe.style.fontSize=pv.length>14?'12px':pv.length>12?'14px':pv.length>10?'16px':'19px'}}
 $('#pt').textContent=f(S.tot.tai[0]);$('#px').textContent=f(S.tot.xiu[0]);poolFx();
 $('#ct').textContent='👤 '+S.tot.tai[1];$('#cx').textContent='👤 '+S.tot.xiu[1];
 $('#mt').textContent=S.my.tai?'Bạn: '+f(S.my.tai):'';$('#mx').textContent=S.my.xiu?'Bạn: '+f(S.my.xiu):'';
 const off=S.phase!=='bet'||closed()||!!S.mt;$('#bt').classList.toggle('off',off);$('#bx').classList.toggle('off',off);
 $('#bt').textContent=$('#bx').textContent=off?(S.phase==='bet'?'ĐÃ KHÓA':'CHỜ KẾT QUẢ'):'CƯỢC';
 if(sheetOn&&closed()){closeSheets();err('Đã đóng cược (còn '+LOCK+'s)')}
 if(sheetOn)sheetUI();
 const wn=(S.phase==='cover'&&opened?S.win:null)||(Date.now()<hold.until?hold.win:null);
 $('#sT').classList.toggle('win',wn==='tai');$('#sX').classList.toggle('win',wn==='xiu');
 const sd=(S.dice||[0,0,0]).join();if(!shaking&&sd!==diceKey){diceKey=sd;$('#dice').innerHTML=(S.dice||[0,0,0]).map(die).join('')}
 bw.className=(S.phase==='cover'&&!opened?'can':'')+(opened?' gone':'')+(dr?' drag':'')+(dropping?' drop':'');
 const tag=$('#tag');
 if(S.phase==='cover'&&opened){tag.textContent=(S.dice[0]+S.dice[1]+S.dice[2])+' · '+(S.jp?'NỔ HŨ':nm(S.dice).toUpperCase());tag.dataset.w=S.win||'bao'}
 else if(Date.now()<hold.until){}else{tag.dataset.w='';if(S.phase==='bet')tag.textContent=''}
 $('#sw').textContent='DÂY THẮNG: '+stk.w;$('#sl').textContent='DÂY THUA: '+stk.l;
 drawCau(S.hist);
 if(S.phase==='bet'&&S.last&&S.last.ago<8)fx(S.last,false);
 if(Date.now()<errUntil)return;
 const sec=secLeft(),R=s=>`${s.dice.join(' - ')} = ${s.dice[0]+s.dice[1]+s.dice[2]}, ${s.jp?'NỔ HŨ':nm(s.dice)}. `+(s.net>0?'Thắng +'+f(s.net):s.net<0?'Thua '+f(s.net):'');
 if(S.mt&&S.phase==='bet'){$('#msg').textContent='Game đang bảo trì - tạm dừng đặt cược';return}
 $('#msg').textContent=S.phase==='bet'?(S.last&&Date.now()<hold.until?`Phiên #${S.last.id}: `+R(S.last):closed()?'Đã đóng cược - đang chờ mở bát':'Bấm CƯỢC ở bên Tài hoặc Xỉu để đặt tiền'):
  S.phase==='cover'?(opened?R(S)+` Phiên mới sau ${sec}s`:'Kéo hẳn bát ra khỏi đĩa để mở kết quả'):''}
async function tick(){try{const r=await api('/api/state');if(!r.err){S=r;S._t=Date.now();render()}else $('#msg').textContent=r.msg||'Hãy mở từ nút trong bot Telegram'}catch(e){}}
setInterval(tick,700);tick();
setInterval(()=>{if(!S)return;const t=secLeft(),c=$('#core'),cd=$('#cd'),hot=S.phase==='bet'&&t>0&&t<=LOCK;
 cd.innerHTML=t+(S.phase==='bet'?`<small>${hot?'ĐÓNG CƯỢC':'NHẬN CƯỢC'}</small>`:'');
 c.classList.toggle('hot',hot);cd.classList.toggle('pulse',S.phase==='bet'&&t>0&&t<=5);
 if(S.phase==='bet'&&t>0&&t<=5&&t!==lastTick){lastTick=t;window.SFX&&SFX.tick()}
 if(hot&&!$('#bt').classList.contains('off'))render();
 if(S.phase==='cover'&&!opened&&!shaking)$('#tag').textContent=t+'s';
 if(Date.now()>=deadline+150&&Date.now()-lastKick>600){lastKick=Date.now();tick()}},250);

let PV={id:null,tai:0,xiu:0};
function poolFx(){if(PV.id!==S.id){PV={id:S.id,tai:S.tot.tai[0],xiu:S.tot.xiu[0]};return}
 [['tai','#pt'],['xiu','#px']].forEach(([k,p])=>{const v=S.tot[k][0];if(v>PV[k]){const e=$(p);e.classList.remove('up');void e.offsetWidth;e.classList.add('up')}PV[k]=v})}

/* ===== kéo bát ===== */
const bw=$('#bowl'),core=$('#core');let px,py,sox,soy;
const pose=()=>{bw.style.transform=`translate(${ox}px,${oy}px) rotate(${Math.max(-22,Math.min(22,ox*.35))}deg) scale(1.07)`};
bw.onpointerdown=e=>{if(!S||S.phase!=='cover'||opened)return;bw.setPointerCapture(e.pointerId);px=e.clientX;py=e.clientY;sox=ox;soy=oy;dr=true;bw.className='drag';window.SFX&&SFX.click()};
bw.onpointermove=e=>{if(!dr)return;ox=sox+e.clientX-px;oy=soy+e.clientY-py;pose();if(Math.hypot(ox,oy)>105)openBowl()};
bw.onpointerup=bw.onpointercancel=()=>{if(!dr)return;dr=false;bw.classList.remove('drag');if(!opened){ox=oy=0;bw.style.transform=''}};
function openBowl(){
 if(opened||!S||S.phase!=='cover'||!S.dice)return;opened=true;dr=false;
 const k=Math.hypot(ox,oy)||1;bw.className='gone';bw.style.transform=`translate(${ox+ox/k*110}px,${oy+oy/k*110}px) rotate(${ox>=0?50:-50}deg) scale(.6)`;
 hap('medium');fx({id:S.id,dice:S.dice,win:S.win,my:S.my,net:S.net,jp:S.jp},true);render()}
function shake(){
 shaking=true;core.classList.add('shk');window.SFX&&SFX.rattle(1.7);
 const iv=setInterval(()=>{$('#dice').innerHTML=[0,0,0].map(()=>die(1+Math.floor(Math.random()*6))).join('')},110);
 setTimeout(()=>{clearInterval(iv);shaking=false;dropping=true;core.classList.remove('shk');
  $('#dice').innerHTML=(S.dice||[0,0,0]).map(die).join('');diceKey=(S.dice||[0,0,0]).join();window.SFX&&SFX.thump();if(S)render();
  setTimeout(()=>{dropping=false;if(S)render()},700)},1800)}

/* ===== hạt vàng / mưa xu / tiền bay vào số dư ===== */
const cv=$('#fx'),g=cv.getContext('2d');let P=[],run=false;
function size(){const d=devicePixelRatio||1;cv.width=innerWidth*d;cv.height=innerHeight*d;g.setTransform(d,0,0,d,0,0)}size();addEventListener('resize',size);
const ctr=()=>{const r=core.getBoundingClientRect();return[r.left+r.width/2,r.top+r.height/2]};
function go(){if(!run){run=true;let t=performance.now();(function L(n){const dt=Math.min(.05,(n-t)/1000);t=n;g.clearRect(0,0,innerWidth,innerHeight);
 P=P.filter(p=>(p.l-=dt)>0);for(const p of P){p.vy+=p.gy*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;g.globalAlpha=Math.min(1,p.l/.5);g.fillStyle=p.c;g.beginPath();g.arc(p.x,p.y,p.s,0,6.283);g.fill()}
 P.length?requestAnimationFrame(L):(run=false,g.clearRect(0,0,innerWidth,innerHeight))})(t)}}
function burst(n,k){const[x,y]=ctr(),pal=k==='lose'?['#78aaff','#c8dcff','#a08cff']:['#ffd75a','#ff96be','#ffffe6','#ffbe3c'];
 for(let i=0;i<n;i++){const a=Math.random()*6.283,v=100+Math.random()*260;P.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,gy:260,l:.8+Math.random()*.8,s:2+Math.random()*3,c:pal[i%pal.length]})}go()}
function rain(n){for(let i=0;i<n;i++)P.push({x:Math.random()*innerWidth,y:-10-Math.random()*200,vx:(Math.random()-.5)*40,vy:80+Math.random()*120,gy:300,l:2+Math.random(),s:3+Math.random()*3,c:i%2?'#ffd75a':'#ffb300'});go()}
function flyBal(txt,w){
 const[x0,y0]=ctr(),b=$('#bal').getBoundingClientRect(),x1=b.left+b.width/2,y1=b.top+b.height/2,e=document.createElement('div');
 const hit=()=>{const b=$('#bal');b.style.setProperty('--g',w?'#ffd05a':'#ff5a6e');b.classList.remove('hit');void b.offsetWidth;b.classList.add('hit')};
 if(!e.animate){hit();return}
 e.className='fly '+(w?'w':'l');e.textContent=txt;document.body.appendChild(e);
 const T=(x,y,k)=>`translate(${x}px,${y}px) translate(-50%,-50%) scale(${k})`;
 e.animate([{transform:T(x0,y0,.5),opacity:0},{transform:T(x0,y0,1.2),opacity:1,offset:.12},{transform:T(x0,y0,1),opacity:1,offset:.45},{transform:T(x1,y1,.55),opacity:.9}],{duration:2400,easing:'cubic-bezier(.45,0,.25,1)',fill:'forwards'}).onfinish=()=>{e.remove();hit()}}

/* ===== NỔ HŨ ===== */
let jpShown=0,jpT=0;
function hideJP(){clearTimeout(jpT);const e=$('#jp');e.className='';e.innerHTML=''}
function showJP(j){
 if(!j||jpShown===j.id)return;jpShown=j.id;const el=$('#jp'),med=['🥇','🥈','🥉','④','⑤'];
 const rows=(j.top||[]).map((w,i)=>`<div class="jr${w.me?' me2':''}" style="animation-delay:${1+i*.16}s"><span class="n">${med[i]} ${esc(w.name)}${w.me?' (Bạn)':''}</span><span style="opacity:.7;font-size:11px">cược ${f(w.bet)}</span><span class="a">+${f(w.amt)}</span></div>`).join('');
 el.innerHTML=`<div class="ray"></div><div style="font-size:40px">👑</div><div class="gd t1">NỔ HŨ</div><div class="t2">★ JACKPOT ★</div><div class="tot" id="jtot">0</div><div style="font-size:12px;opacity:.85">Tổng tiền hũ đã nổ · ${j.n} người trúng</div>${j.me>0?`<div class="me">Bạn nhận +${f(j.me)}</div>`:''}<div class="rows">${rows}</div><div class="x">CHẠM ĐỂ ĐÓNG</div>`;
 el.className='on';rain(80);burst(150,'win');
 const tot=j.total,t0=performance.now();(function cu(n){const e=document.getElementById('jtot');if(!e)return;const u=Math.min(1,(n-t0)/2400);e.textContent=f(tot*(1-Math.pow(1-u,3)));if(u<1)requestAnimationFrame(cu)})(t0);
 window.SFX&&(SFX.clang(),SFX.win(),setTimeout(()=>SFX.win(),650));
 try{tg.HapticFeedback&&tg.HapticFeedback.notificationOccurred(j.me>0?'success':'warning')}catch(e){}
 clearTimeout(jpT);jpT=setTimeout(hideJP,12000)}
$('#jp').onclick=hideJP;

/* ===== Nhạc nền chill + âm thanh hiệu ứng (Web Audio, không cần file) ===== */
(()=>{
const AC=window.AudioContext||window.webkitAudioContext;if(!AC){$('#mus').style.display='none';return}
let ctx,master,sg,noise,on=true,started=false,step=0,next=0;
const hz=m=>440*Math.pow(2,(m-69)/12),BPM=68,B=60/BPM;
const CHD=[[57,60,64,67,71],[53,57,60,64,67],[48,55,59,64,67],[55,59,62,64,69]],bass=[45,41,36,43];
function tone(t,m,d,type,g,lp,dst){const o=ctx.createOscillator(),v=ctx.createGain(),f=ctx.createBiquadFilter();
 o.type=type;o.frequency.value=hz(m);f.type='lowpass';f.frequency.value=lp;
 v.gain.setValueAtTime(0,t);v.gain.linearRampToValueAtTime(g,t+Math.min(.6,d*.3));v.gain.exponentialRampToValueAtTime(.0001,t+d);
 o.connect(f);f.connect(v);v.connect(dst||master);o.start(t);o.stop(t+d+.05)}
function bar(t,i){const c=CHD[i%4];
 c.forEach(m=>tone(t,m,B*4.2,'triangle',.05,1400));tone(t,bass[i%4],B*3.8,'sine',.12,300);
 for(let k=0;k<8;k++)if(Math.random()<.72)tone(t+k*B/2,c[Math.floor(Math.random()*c.length)]+12,B*1.6,'sine',.045,3200)}
function sched(){while(next<ctx.currentTime+1.5){bar(next,step++);next+=B*4}}
function start(){if(started)return;started=true;ctx=new AC();
 master=ctx.createGain();master.gain.value=0;sg=ctx.createGain();sg.gain.value=on?1:0;
 noise=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate);const nd=noise.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
 const d=ctx.createDelay(1);d.delayTime.value=B*.75;const fb=ctx.createGain();fb.gain.value=.35;
 master.connect(ctx.destination);master.connect(d);d.connect(fb);fb.connect(d);d.connect(ctx.destination);sg.connect(ctx.destination);
 next=ctx.currentTime+.1;sched();setInterval(sched,400);if(on)master.gain.linearRampToValueAtTime(.8,ctx.currentTime+3)}
function burst(t,f,g,len){const s=ctx.createBufferSource(),b=ctx.createBiquadFilter(),v=ctx.createGain();
 s.buffer=noise;b.type='bandpass';b.frequency.value=f;b.Q.value=2;
 v.gain.setValueAtTime(g,t);v.gain.exponentialRampToValueAtTime(.0001,t+len);
 s.connect(b);b.connect(v);v.connect(sg);s.start(t,Math.random()*.8);s.stop(t+len+.02)}
const ok=()=>ctx&&on;
window.SFX={
 rattle(d){if(!ok())return;const t=ctx.currentTime,n=Math.floor(d*26);
  for(let i=0;i<n;i++){const tt=t+i*d/n+Math.random()*.02;burst(tt,2200+Math.random()*3500,.5,.045);if(i%3==0)burst(tt,500+Math.random()*400,.35,.05)}},
 thump(){if(!ok())return;const t=ctx.currentTime,o=ctx.createOscillator(),v=ctx.createGain();
  o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(40,t+.25);
  v.gain.setValueAtTime(.7,t);v.gain.exponentialRampToValueAtTime(.0001,t+.3);o.connect(v);v.connect(sg);o.start(t);o.stop(t+.35);burst(t,1800,.5,.08)},
 tick(){if(!ok())return;const t=ctx.currentTime;tone(t,88,.12,'sine',.25,4000,sg)},
 click(){if(!ok())return;const t=ctx.currentTime;tone(t,81,.07,'triangle',.2,5000,sg);burst(t,3500,.25,.03)},
 win(){if(!ok())return;const t=ctx.currentTime;[72,76,79,84,88].forEach((m,i)=>tone(t+i*.09,m,.6,'triangle',.22,6000,sg));
  for(let i=0;i<10;i++)tone(t+.3+i*.06,96+Math.floor(Math.random()*8),.25,'sine',.1,8000,sg)},
 lose(){if(!ok())return;const t=ctx.currentTime;tone(t,60,.5,'triangle',.18,1500,sg);tone(t+.18,55,.7,'triangle',.18,1200,sg)}
};
Object.assign(SFX,{
 thunder(){if(!ok())return;const t=ctx.currentTime,x=ctx.createBufferSource(),f=ctx.createBiquadFilter(),v=ctx.createGain();x.buffer=noise;x.loop=true;f.type='lowpass';f.frequency.setValueAtTime(1100,t);f.frequency.exponentialRampToValueAtTime(110,t+1.7);
  v.gain.setValueAtTime(.0001,t);v.gain.exponentialRampToValueAtTime(.9,t+.04);v.gain.exponentialRampToValueAtTime(.0001,t+1.9);x.connect(f);f.connect(v);v.connect(sg);x.start(t);x.stop(t+2);burst(t,5000,.6,.09)},
 roar(){if(!ok())return;const t=ctx.currentTime,o=ctx.createOscillator(),l=ctx.createOscillator(),lg=ctx.createGain(),f=ctx.createBiquadFilter(),v=ctx.createGain();
  o.type='sawtooth';o.frequency.setValueAtTime(130,t);o.frequency.exponentialRampToValueAtTime(52,t+1);l.frequency.value=26;lg.gain.value=14;l.connect(lg);lg.connect(o.frequency);
  f.type='lowpass';f.frequency.setValueAtTime(900,t);f.frequency.exponentialRampToValueAtTime(260,t+1);v.gain.setValueAtTime(.0001,t);v.gain.exponentialRampToValueAtTime(.32,t+.12);v.gain.exponentialRampToValueAtTime(.0001,t+1.1);
  o.connect(f);f.connect(v);v.connect(sg);o.start(t);l.start(t);o.stop(t+1.2);l.stop(t+1.2);burst(t+.05,350,.5,.9)},
 slash(){if(!ok())return;const t=ctx.currentTime,x=ctx.createBufferSource(),b=ctx.createBiquadFilter(),v=ctx.createGain();x.buffer=noise;b.type='bandpass';b.Q.value=1.6;b.frequency.setValueAtTime(1000,t);b.frequency.exponentialRampToValueAtTime(7000,t+.3);
  v.gain.setValueAtTime(.0001,t);v.gain.exponentialRampToValueAtTime(.7,t+.15);v.gain.exponentialRampToValueAtTime(.0001,t+.38);x.connect(b);b.connect(v);v.connect(sg);x.start(t);x.stop(t+.4)},
 clang(){if(!ok())return;const t=ctx.currentTime;[81,88,96,103].forEach((m,i)=>tone(t,m,.7-i*.1,'triangle',.24/(i+1),9000,sg));burst(t,4500,.7,.12);burst(t,300,.6,.25)}
});
function set(v){on=v;$('#mus').classList.toggle('off',!v);try{localStorage.setItem('mus',v?1:0)}catch(e){}
 if(!started){if(v)start();return}
 ctx.resume();sg.gain.value=v?1:0;master.gain.cancelScheduledValues(ctx.currentTime);master.gain.linearRampToValueAtTime(v?.8:0,ctx.currentTime+(v?1:.4))}
try{if(localStorage.getItem('mus')==='0')on=false}catch(e){}
$('#mus').classList.toggle('off',!on);
$('#mus').onclick=e=>{e.stopPropagation();set(!on)};
addEventListener('pointerdown',()=>{if(!started)start();else if(ctx.state==='suspended')ctx.resume()},{passive:true});
document.addEventListener('visibilitychange',()=>{if(!ctx)return;document.hidden?ctx.suspend():ctx.resume()});
})();


</script>
